<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silver Fortnight</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --sf-primary: #1f7a55;
      --sf-primary-dark: #17603f;
      --sf-primary-rgb: 31, 122, 85;
      --sf-primary-soft: #e6f2ec;
      --sf-ink: #1f2b26;
      --sf-muted: #7a8a83;
      --sf-border: #e5eae7;
      --sf-bg: #f5f7f6;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.9375rem;
      background: var(--sf-bg);
      color: #3c4a44;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--sf-ink);
      letter-spacing: -0.015em;
    }

    a { color: var(--sf-primary); }
    a:hover { color: var(--sf-primary-dark); }

    .text-primary { color: var(--sf-primary) !important; }
    .bg-primary { background-color: var(--sf-primary) !important; }
    .text-bg-primary { background-color: var(--sf-primary) !important; }
    .bg-primary-subtle { background-color: var(--sf-primary-soft) !important; }
    .text-primary-emphasis { color: var(--sf-primary-dark) !important; }
    .link-primary {
      color: var(--sf-primary) !important;
      text-decoration-color: rgba(var(--sf-primary-rgb), 0.4) !important;
    }
    .link-primary:hover { color: var(--sf-primary-dark) !important; }

    .navbar {
      background: #fff;
      padding-top: 0.65rem;
      padding-bottom: 0.65rem;
    }
    .navbar-brand { letter-spacing: -0.02em; color: var(--sf-ink) !important; }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.05rem;
      height: 2.05rem;
      border-radius: 0.6rem;
      background: var(--sf-primary);
      color: #fff;
      font-size: 1.05rem;
      box-shadow: 0 2px 6px rgba(var(--sf-primary-rgb), 0.35);
    }
    .nav-link {
      font-size: 0.885rem;
      font-weight: 500;
      color: #55655e;
      border-radius: 0.55rem;
      margin: 0 0.1rem;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-link:hover { background: #f0f4f2; color: var(--sf-ink); }
    .nav-link.active {
      background: var(--sf-primary-soft);
      color: var(--sf-primary) !important;
      font-weight: 600;
    }

    .card {
      border: 1px solid var(--sf-border);
      border-radius: 0.875rem;
      background: #fff;
      box-shadow: 0 1px 3px rgba(20, 30, 25, 0.04);
    }
    .border.rounded, .border.rounded-3 {
      background: #fff;
      border-color: var(--sf-border) !important;
      border-radius: 0.875rem !important;
      box-shadow: 0 1px 3px rgba(20, 30, 25, 0.04);
      overflow: hidden;
    }
    .toolbar {
      background: #fff;
      border: 1px solid var(--sf-border);
      border-radius: 0.875rem;
      padding: 0.9rem;
      box-shadow: 0 1px 3px rgba(20, 30, 25, 0.04);
    }
    .hero-panel {
      background: linear-gradient(165deg, #ffffff 0%, #edf6f1 100%);
      border: 1px solid var(--sf-border);
      border-radius: 1.1rem;
      box-shadow: 0 1px 3px rgba(20, 30, 25, 0.04);
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--sf-border);
      border-radius: 0.875rem;
      padding: 1.1rem 1.15rem;
      height: 100%;
      box-shadow: 0 1px 3px rgba(20, 30, 25, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      border-color: #d5ded9;
      box-shadow: 0 6px 18px rgba(20, 30, 25, 0.08);
    }
    .stat-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.3rem;
      height: 2.3rem;
      border-radius: 0.65rem;
      font-size: 1.05rem;
    }
    .stat-value {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.15;
      color: var(--sf-ink);
      letter-spacing: -0.02em;
    }
    .stat-label {
      font-size: 0.71rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--sf-muted);
      margin-top: 0.2rem;
    }

    .chip-blue { background: #e8f1fb; color: #2f80c3; }
    .chip-green { background: #e6f4ea; color: #2e8b57; }
    .chip-purple { background: #efeaf7; color: #7e5bb5; }
    .chip-pink { background: #fdeef3; color: #d25487; }
    .chip-orange { background: #fdf3e4; color: #d98a2b; }
    .chip-teal { background: #e4f4f2; color: #22908a; }

    .avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.45rem;
      height: 2.45rem;
      border-radius: 50%;
      background: var(--sf-primary-soft);
      color: var(--sf-primary);
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .table { margin-bottom: 0; }
    .table thead th {
      font-size: 0.71rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--sf-muted);
      padding: 0.75rem 1rem;
      white-space: nowrap;
      border-bottom: 1px solid var(--sf-border) !important;
    }
    .table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid #f0f3f2;
    }
    .table tbody tr:last-child td { border-bottom: 0; }
    .table tbody tr { transition: background 0.1s; }
    .table tbody tr:hover { background: #f8faf9; }

    .badge {
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.02em;
      padding: 0.42em 0.7em;
      border-radius: 0.45rem;
    }

    .btn {
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 0.55rem;
      padding: 0.48rem 0.95rem;
    }
    .btn-sm {
      font-size: 0.8125rem;
      border-radius: 0.5rem;
      padding: 0.34rem 0.72rem;
    }
    .btn-primary {
      --bs-btn-bg: var(--sf-primary);
      --bs-btn-border-color: var(--sf-primary);
      --bs-btn-hover-bg: var(--sf-primary-dark);
      --bs-btn-hover-border-color: var(--sf-primary-dark);
      --bs-btn-active-bg: var(--sf-primary-dark);
      --bs-btn-active-border-color: var(--sf-primary-dark);
      --bs-btn-disabled-bg: var(--sf-primary);
      --bs-btn-disabled-border-color: var(--sf-primary);
      --bs-btn-focus-shadow-rgb: var(--sf-primary-rgb);
      box-shadow: 0 1px 3px rgba(var(--sf-primary-rgb), 0.3);
    }
    .btn-outline-primary {
      --bs-btn-color: var(--sf-primary);
      --bs-btn-border-color: #b9d6c8;
      --bs-btn-hover-bg: var(--sf-primary);
      --bs-btn-hover-border-color: var(--sf-primary);
      --bs-btn-active-bg: var(--sf-primary);
      --bs-btn-active-border-color: var(--sf-primary);
      --bs-btn-focus-shadow-rgb: var(--sf-primary-rgb);
    }
    .btn-outline-secondary { --bs-btn-border-color: #d3dcd7; --bs-btn-color: #5c6b64; }
    .btn-outline-secondary:hover { background: var(--sf-ink); border-color: var(--sf-ink); }
    .btn-outline-danger { --bs-btn-border-color: #f0c4c4; }

    .form-control, .form-select {
      font-size: 0.9rem;
      border-radius: 0.55rem;
      border-color: #d7dfdb;
      padding: 0.5rem 0.8rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: #8cc7ae;
      box-shadow: 0 0 0 0.22rem rgba(var(--sf-primary-rgb), 0.12);
    }
    .form-label {
      font-weight: 600;
      font-size: 0.8125rem;
      color: #4c5a54;
      margin-bottom: 0.35rem;
    }
    .form-text { font-size: 0.78rem; }
    .input-group-text {
      border-color: #d7dfdb;
      border-radius: 0.55rem;
      background: #f7faf9;
      color: var(--sf-muted);
    }

    .modal-content {
      border: 0;
      border-radius: 1rem;
      box-shadow: 0 14px 44px rgba(20, 30, 25, 0.2);
    }
    .modal-header { padding: 1.15rem 1.4rem 0.9rem; border-bottom-color: #eef1f0; }
    .modal-title { font-weight: 700; }
    .modal-body { padding: 1.4rem; }
    .modal-footer { padding: 0.9rem 1.4rem 1.2rem; border-top-color: #eef1f0; gap: 0.5rem; }

    .alert { border: 0; border-radius: 0.65rem; font-size: 0.875rem; }
    .progress { background: #eaf0ed; border-radius: 99rem; overflow: hidden; }
    .toast {
      min-width: 270px;
      max-width: 360px;
      font-size: 0.875rem;
      border-radius: 0.65rem;
      box-shadow: 0 8px 24px rgba(20, 30, 25, 0.18);
    }

    .loading-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 2.5rem 1rem;
      color: var(--sf-muted);
      font-size: 0.9rem;
      background: #fff;
      border: 1px dashed #d3dcd7;
      border-radius: 0.875rem;
    }

    @media (max-width: 575.98px) {
      .container { padding-left: 1rem; padding-right: 1rem; }
      h1.h4 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4.3.0/dist/vue-router.global.js"></script>
  <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
