<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silver Fortnight</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <style>
    body { font-size: 0.9375rem; }

    /* Navbar */
    .navbar-brand { letter-spacing: -0.01em; }
    .nav-link { font-size: 0.9rem; }

    /* Cards and surfaces */
    .card { border-color: rgba(0,0,0,.08); border-radius: 0.75rem; }
    .modal-content { border-radius: 0.75rem; }
    .border.rounded, .border.rounded-3 { border-radius: 0.625rem !important; }
    .border.rounded.p-3, .border.rounded.p-4 {
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }

    /* Stat card hover lift */
    .border.rounded.p-3.text-center {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .border.rounded.p-3.text-center:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(0,0,0,.09) !important;
    }

    /* Table headers */
    .table thead th {
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6c757d;
    }
    .table tbody tr { transition: background 0.1s; }
    .table-hover tbody tr:hover { background: rgba(13,110,253,.03); }

    /* Badges */
    .badge { font-weight: 500; letter-spacing: 0.02em; }

    /* Buttons */
    .btn { font-size: 0.875rem; }
    .btn-sm { font-size: 0.8125rem; }

    /* Form controls */
    .form-control, .form-select {
      font-size: 0.9rem;
    }
    .form-control:focus, .form-select:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,.12);
    }
    .form-label { font-weight: 500; font-size: 0.875rem; margin-bottom: 0.3rem; }

    /* Progress bar */
    .progress { border-radius: 1rem; overflow: hidden; }

    /* Toast stack */
    .toast { min-width: 270px; max-width: 360px; font-size: 0.875rem; border-radius: 0.6rem; }

    /* Mobile: make tables horizontally scrollable (already via .table-responsive) */
    @media (max-width: 575.98px) {
      .container { padding-left: 1rem; padding-right: 1rem; }
      h1.h4 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4.3.0/dist/vue-router.global.js"></script>
  <script src="https://unpkg.com/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
